# Lab 5: calibrate the LLM judge before you trust it.
#
# The mock executor returns each prompt as the answer (no agent, no Copilot request for an agent).
# Each answer is graded twice: by the code check from Lab 2 (is CT-102 absent?) and by an LLM
# judge that reads the answer and the rubric. Only the judge calls a model: by default a Copilot
# model, on your Copilot plan.
#
# Run it:
#   vally eval -e evals/judge-controls.eval.yaml
# Another judge model: add --param JUDGE_MODEL=<model-id>. Your own endpoint: see Lab 5 on the site.
name: release-notes-judge-controls
description: >-
  Calibrates the LLM judge on four known answers: good, wrong, a note that mentions the
  unfinished item, and an answer without a summary sentence.
defaults:
  executor: mock
  runs: 1
  timeout: 60s
  judge_model: ${JUDGE_MODEL=gpt-5.6-luna}   # the judge: a Copilot model, from another model family than the agent's
  judge_timeout: 2m
scoring:
  threshold: 1
stimuli:
  # Answer C from Lab 1: completed work only, with a summary sentence.
  - name: known-good-answer
    prompt: |
      This release makes it easier to find things and gives the dashboard a darker look.

      - CT-101: Search across all projects
      - CT-103: Dark mode for the dashboard
    # The rubric: what the judge must check, one criterion per line. Defined once here (&rubric)
    # and reused below (*rubric), so all four answers are judged against the same criteria.
    # (Grader names must be unique in a file, so the graders are written out for each answer.)
    rubric: &rubric
      - The answer announces CT-101 (Search across all projects) and CT-103 (Dark mode for the dashboard) as part of this release.
      - The answer does not announce CT-102 (Export reports to CSV) as part of this release. Saying that CT-102 is unfinished or was left out is acceptable.
      - The answer starts with one short sentence that summarizes the release.
      - The tone is friendly and the answer is short.
    graders:
      - type: output-contains   # the code check from Lab 2
        name: good-no-ct102
        config: { substring: CT-102, negate: true }
      - type: prompt            # the LLM judge: reads the answer, applies the rubric
        name: good-judge
        config:
          scoring: binary       # pass or fail; easier to calibrate than a 1-5 scale

  # Answer A from Lab 1: announces CT-102, which is still in progress.
  - name: wrong-answer
    prompt: |
      This release makes finding things and working late a lot easier.

      - CT-101: Search across all projects
      - CT-102: Export reports to CSV
      - CT-103: Dark mode for the dashboard
    rubric: *rubric
    graders:
      - type: output-contains
        name: wrong-no-ct102
        config: { substring: CT-102, negate: true }
      - type: prompt
        name: wrong-judge
        config:
          scoring: binary

  # Answer B from Lab 1: leaves CT-102 out of the list, but talks about it in a note.
  - name: note-mentions-unfinished-item
    prompt: |
      This release makes it easier to find things and easier on the eyes.

      - CT-101: Search across all projects
      - CT-103: Dark mode for the dashboard

      I left out CT-102 ("Export reports to CSV") because backlog.json marks it as in-progress.
    rubric: *rubric
    graders:
      - type: output-contains
        name: note-no-ct102
        config: { substring: CT-102, negate: true }
      - type: prompt
        name: note-judge
        config:
          scoring: binary

  # Answer D from Lab 1: the right items, but no summary sentence.
  - name: no-summary-sentence
    prompt: |
      - CT-101: Search across all projects
      - CT-103: Dark mode for the dashboard
    rubric: *rubric
    graders:
      - type: output-contains
        name: nosummary-no-ct102
        config: { substring: CT-102, negate: true }
      - type: prompt
        name: nosummary-judge
        config:
          scoring: binary
